<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Restaurant-Menu Admin</title>
    <link rel="stylesheet" href="../conection/admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="sidebar-overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo"><img src="../image/admin.jpeg" alt="Admin Logo"
                    style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;"><span>Admin Panel</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="Admin_page.html" data-section="dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="orders.html" data-section="orders"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="Admin_page.html#menu" data-section="menu"><i class="fas fa-book-open"></i> Menu</a></li>
                <li><a href="analytics.html" data-section="analytics"><i class="fas fa-chart-line"></i> Analytics</a></li>
                <li><a href="users.html" data-section="users"><i class="fas fa-user-friends"></i> Users</a></li>
                <li><a href="settings.html" data-section="settings" class="active"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="mobile-menu-toggle" id="mobileToggle" aria-label="Toggle mobile menu"><i
                        class="fas fa-bars"></i></button>
                <h2 id="pageTitle" style="font-size: 1.2rem;">Settings</h2>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <button id="darkModeToggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <section id="settings" class="content-section active">
            <div style="background: var(--bg-card); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
                <h3 style="margin-bottom: 1rem;">Global Settings</h3>
                <p>Configure system-wide settings and preferences.</p>
            </div>

            <div style="background: var(--bg-card); padding: 1.5rem; border-radius: 12px; max-width: 600px;">
                <h4 style="margin-bottom: 1rem;">General Settings</h4>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Restaurant Name</label>
                    <input type="text" value="Restaurant-Menu" 
                        style="padding: 10px; border-radius: 8px; border: 1px solid var(--secondary-color); background: var(--bg-main); color: var(--text-main); width: 100%;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Contact Email</label>
                    <input type="email" value="contact@restaurant.com" 
                        style="padding: 10px; border-radius: 8px; border: 1px solid var(--secondary-color); background: var(--bg-main); color: var(--text-main); width: 100%;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Currency</label>
                    <select 
                        style="padding: 10px; border-radius: 8px; border: 1px solid var(--secondary-color); background: var(--bg-main); color: var(--text-main); width: 100%;">
                        <option>Tsh (Tanzanian Shilling)</option>
                        <option>USD (US Dollar)</option>
                        <option>EUR (Euro)</option>
                    </select>
                </div>
                <button type="button" 
                    style="background: var(--primary-color); color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer;">
                    Save Settings
                </button>
            </div>
        </section>
    </main>

    <script src="../conection/function-page/admin-function.js"></script>
</body>

</html>
